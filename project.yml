name: Kinetics
options:
  bundleIdPrefix: com.rayancheca
  deploymentTarget:
    iOS: "17.0"
  defaultConfig: Debug
  xcodeVersion: "16.2"
  createIntermediateGroups: true
  generateEmptyDirectories: true
  generateSchemes: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    ENABLE_USER_SCRIPT_SANDBOXING: NO

configs:
  Debug: debug
  Release: release

packages:
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk
    from: "11.0.0"
  Lottie:
    url: https://github.com/airbnb/lottie-spm
    from: "4.4.3"

targets:
  Kinetics:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Kinetics/App
      - path: Kinetics/Core
      - path: Kinetics/Modules
      - path: Kinetics/Shared
      - path: Kinetics/Firebase
      - path: Kinetics/Home
    resources:
      - path: Kinetics/Resources/Assets.xcassets
      - path: Kinetics/Resources/GoogleService-Info.plist
      - path: Kinetics/Resources/PrivacyInfo.xcprivacy
      - path: Kinetics/Resources/Lottie
    info:
      path: Kinetics/Info.plist
      properties:
        CFBundleDisplayName: Kinetics
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        NSCameraUsageDescription: "Kinetics uses your camera to analyze movement and provide real-time biomechanics coaching feedback."
        NSMicrophoneUsageDescription: "Kinetics uses the microphone for real-time coaching audio during live training sessions."
        NSPhotoLibraryUsageDescription: "Kinetics uses your photo library to import workout videos for AI analysis."
        NSLocationWhenInUseUsageDescription: "Kinetics tracks your route, pace, and distance during outdoor workouts."
        NSLocationAlwaysAndWhenInUseUsageDescription: "Kinetics tracks your route in the background so your full workout is recorded even when the screen is off."
        NSHealthShareUsageDescription: "Kinetics reads your heart rate and step count to enhance workout tracking."
        NSHealthUpdateUsageDescription: "Kinetics writes your workouts to Apple Health so they appear in your Health app activity history."
        NSUserNotificationUsageDescription: "Kinetics sends workout reminders and achievement alerts to keep you on track."
        CFBundleURLTypes:
          - CFBundleURLSchemes:
              - kinetics
            CFBundleURLName: com.rayancheca.kinetics
        UIApplicationSupportsIndirectInputEvents: YES
        UILaunchScreen:
          UIColorName: "LaunchBackground"
          UIImageName: "LaunchLogo"
        UIBackgroundModes:
          - location
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIRequiresFullScreen: YES
    entitlements:
      path: Kinetics/Kinetics.entitlements
    dependencies:
      - sdk: WatchConnectivity.framework
      - package: Firebase
        product: FirebaseAnalytics
      - package: Firebase
        product: FirebaseAuth
      - package: Firebase
        product: FirebaseCrashlytics
      - package: Firebase
        product: FirebaseFirestore
      - package: Firebase
        product: FirebaseStorage
      - package: Lottie
        product: Lottie
      - target: KineticsWidget
        embed: true
      - target: KineticsWatch
        embed: true
        embedType: watchosApp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.rayancheca.kinetics
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ""
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: 1.0.0
      configs:
        Debug:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
        Release:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: ""

  KineticsWidget:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: KineticsWidget
    info:
      path: KineticsWidget/Info.plist
      properties:
        CFBundleDisplayName: KineticsWidget
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: KineticsWidget/KineticsWidget.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.rayancheca.kinetics.widget
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ""
        SWIFT_VERSION: "6.0"

  KineticsWatch:
    type: application
    platform: watchOS
    deploymentTarget: "10.0"
    sources:
      - path: KineticsWatch
    info:
      path: KineticsWatch/Info.plist
      properties:
        CFBundleDisplayName: Kinetics
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        WKWatchOnly: false
        NSHealthShareUsageDescription: "Kinetics reads your heart rate during workouts to display live metrics on your watch."
    entitlements:
      path: KineticsWatch/KineticsWatch.entitlements
    dependencies:
      - sdk: WatchKit.framework
      - sdk: HealthKit.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.rayancheca.kinetics.watch
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ""
        SWIFT_VERSION: "6.0"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
